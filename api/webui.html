<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PSX AI Scanner</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141a24; --panel2:#1b2331; --line:#26303f;
    --text:#e6edf6; --muted:#8a97a8; --green:#2ecc71; --red:#ff5c6c;
    --amber:#f5b53d; --accent:#4c9ffe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:var(--accent)}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0 6px}
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header .sub{color:var(--muted);font-size:12px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;
    font-size:12px;letter-spacing:.4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin:12px 0}
  .card h2{font-size:12px;letter-spacing:.6px;color:var(--muted);margin:0 0 12px;
    text-transform:uppercase;font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:18px}
  .kv .k{color:var(--muted);font-size:11px}
  .kv .v{font-weight:800;font-size:16px}
  input{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 12px;font-size:15px;width:100%}
  input::placeholder{color:#61708700}
  button{background:var(--accent);color:#04121f;border:0;border-radius:10px;
    padding:11px 16px;font-size:15px;font-weight:800;cursor:pointer}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);
    font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .muted{color:var(--muted)}
  .err{color:var(--red);font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);
    white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
  .scroll{overflow-x:auto}
  .gate{max-width:420px;margin:8vh auto;text-align:center}
  .gate .card{text-align:left}
  .reasons{margin:10px 0 0;padding-left:18px}
  .reasons li{margin:4px 0;color:#cdd6e2;font-size:14px}
  .hide{display:none}
  .flex{display:flex;gap:10px}
  .grow{flex:1}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin:22px 0 8px}
  .badge-buy{background:rgba(46,204,113,.16);color:var(--green)}
  .badge-sell,.badge-avoid{background:rgba(255,92,108,.16);color:var(--red)}
  .badge-watch,.badge-neutral{background:rgba(245,181,61,.16);color:var(--amber)}
  .scrbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .scrbtn{background:var(--panel2);border:1px solid var(--line);color:#cdd6e2;
    border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .scrbtn.active{background:var(--accent);color:#04121f;border-color:var(--accent)}
  .scrbtn .n{opacity:.7;font-weight:600;margin-left:5px}
  .note{color:var(--amber);font-size:12px;margin:8px 0;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">

  <!-- KEY GATE -->
  <div id="gate" class="gate">
    <h1 style="letter-spacing:.4px">📈 PSX AI Scanner</h1>
    <p class="muted" style="font-size:13px">Apni API key daal kar data dekhein.</p>
    <div class="card">
      <h2>API Key</h2>
      <input id="keyInput" type="password" placeholder="X-API-Key…" autocomplete="off" />
      <div style="height:10px"></div>
      <button id="keyBtn" style="width:100%">Load data</button>
      <p id="gateErr" class="err hide" style="margin:10px 0 0"></p>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main" class="hide">
    <header>
      <div>
        <h1>📈 PSX AI Scanner</h1>
        <div class="sub" id="asof">end-of-day snapshot</div>
      </div>
      <div class="flex">
        <button class="ghost" id="refreshBtn" title="Refresh">↻</button>
        <button class="ghost" id="logoutBtn" title="Change key">key</button>
      </div>
    </header>

    <!-- DAILY SIGNAL -->
    <div class="card" id="signalCard">
      <h2>Daily Market Signal</h2>
      <div id="signalBody" class="muted">Loading…</div>
    </div>

    <!-- STOCK LOOKUP -->
    <div class="card">
      <h2>Stock Lookup</h2>
      <div class="flex">
        <input id="tk" class="grow" placeholder="Symbol, e.g. MCB" autocomplete="off"
          style="text-transform:uppercase" />
        <button id="tkBtn">Search</button>
      </div>
      <div id="stockBody" style="margin-top:12px"></div>
    </div>

    <!-- SCREENERS -->
    <div class="card">
      <h2>Screeners — click &amp; go</h2>
      <div id="scrBtns" class="scrbtns muted">Loading…</div>
      <div id="scrNote" class="note"></div>
      <div id="scrBody" class="scroll"></div>
    </div>

    <!-- OPPORTUNITIES -->
    <div class="card">
      <h2>Top Opportunities</h2>
      <div id="oppBody" class="scroll muted">Loading…</div>
    </div>

    <div class="foot">
      Rule-based end-of-day scan · not live quotes · not financial advice.
    </div>
  </div>

</div>

<script>
(function(){
  var KEY_LS = "psx_api_key";
  var $ = function(id){ return document.getElementById(id); };

  function getKey(){ return localStorage.getItem(KEY_LS) || ""; }
  function setKey(k){ localStorage.setItem(KEY_LS, k); }
  function clearKey(){ localStorage.removeItem(KEY_LS); }

  function num(v, d){ if(v===null||v===undefined||v==="") return "—";
    var n = Number(v); if(isNaN(n)) return String(v);
    return n.toLocaleString(undefined,{maximumFractionDigits:(d===undefined?2:d)}); }

  function badgeClass(s){ s=(s||"").toUpperCase();
    if(s.indexOf("BUY")>-1||s==="BULLISH") return "badge-buy";
    if(s.indexOf("AVOID")>-1||s.indexOf("SELL")>-1||s==="BEARISH") return "badge-avoid";
    return "badge-watch"; }

  function kv(k,v,cls){ return '<div class="kv"><div class="k">'+k+'</div><div class="v" '+
    (cls?'style="color:'+cls+'"':'')+'>'+v+'</div></div>'; }

  // fetch helper — sends the key header, throws readable errors
  function api(path){
    return fetch(path, { headers: { "X-API-Key": getKey() } }).then(function(r){
      if(r.status===401) throw new Error("Ghalat ya missing API key.");
      if(!r.ok) return r.json().catch(function(){return {};}).then(function(j){
        throw new Error((j && j.detail) ? j.detail : ("HTTP "+r.status)); });
      return r.json();
    });
  }

  // ---- renderers ----
  function renderSignal(s){
    var v = (s.verdict||"—").toUpperCase();
    var conf = s.confidence!=null ? Math.round(s.confidence*100)+"%" : "—";
    var reasons = (s.reasons||[]).slice(0,4).map(function(x){return "<li>"+x+"</li>";}).join("");
    $("asof").textContent = "as of " + (s.date||"—");
    $("signalBody").innerHTML =
      '<div class="row" style="align-items:center">'+
        '<span class="pill '+badgeClass(v)+'" style="font-size:15px;padding:6px 14px">'+v+'</span>'+
        kv("Confidence", conf)+
        kv("Bullishness", num(s.bullishness,2))+
        kv("Date", s.date||"—")+
      '</div>'+
      (reasons? '<ul class="reasons">'+reasons+'</ul>' : '');
  }

  function renderOpps(d){
    var rows = (d.opportunities||[]);
    if(!rows.length){ $("oppBody").innerHTML = '<span class="muted">No opportunities in the latest scan.</span>'; return; }
    var h = '<table><thead><tr><th>Symbol</th><th>Decision</th><th>Close</th><th>Chg%</th>'+
      '<th>Buy prob</th><th>Stop</th><th>T1</th><th>T2</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var chg = Number(r.change_pct);
      h += '<tr>'+
        '<td style="font-weight:800">'+(r.symbol||"—")+'</td>'+
        '<td><span class="pill '+badgeClass(r.final_decision)+'">'+(r.final_decision||"—")+'</span></td>'+
        '<td>'+num(r.close)+'</td>'+
        '<td style="color:'+(chg>=0?"var(--green)":"var(--red)")+'">'+num(r.change_pct)+'</td>'+
        '<td>'+num(r.buy_probability,1)+'</td>'+
        '<td>'+num(r.stop_loss)+'</td>'+
        '<td>'+num(r.target_1)+'</td>'+
        '<td>'+num(r.target_2)+'</td>'+
      '</tr>';
    });
    h += '</tbody></table>';
    $("oppBody").innerHTML = h;
  }

  function renderStock(d){
    var p = d.price||{}, sc = d.scoring||{}, sn = d.news_sentiment;
    var chg = Number(p.change_pct);
    var html =
      '<div class="row" style="margin-bottom:6px">'+
        '<div><div class="v" style="font-size:18px">'+(d.symbol||"")+'</div>'+
        '<div class="k muted">'+((d.company||"")+" · "+(d.sector||""))+'</div></div>'+
      '</div>'+
      '<div class="row">'+
        kv("Close", num(p.close))+
        kv("Chg%", num(p.change_pct), chg>=0?"var(--green)":"var(--red)")+
        kv("Decision", '<span class="pill '+badgeClass(sc.final_decision)+'">'+(sc.final_decision||"—")+'</span>')+
        kv("Buy prob", num(sc.buy_probability,1))+
        kv("Stop", num(sc.stop_loss))+
        kv("T1", num(sc.target_1))+
        kv("T2", num(sc.target_2))+
      '</div>';
    if(sn){
      html += '<div class="row" style="margin-top:10px">'+
        kv("News", '<span class="pill '+badgeClass(sn.sentiment_label)+'">'+(sn.sentiment_label||"—")+'</span>')+
        kv("Score", num(sn.sentiment_score,2))+
        kv("Headlines", num(sn.n_headlines,0))+
      '</div>';
    }
    $("stockBody").innerHTML = html;
  }

  // ---- screeners ----
  var SCR_LABELS = {change_pct:"Chg%", buy_probability:"Buy%", value_traded:"Value",
    vol_ratio:"Vol x", pct_to_52w_high:"% to 52wH", ma50:"MA50", ma200:"MA200",
    final_decision:"Decision", volume:"Vol", accumulation_score:"Accum",
    smart_money_score:"SmartMoney", stop_loss:"Stop", target_1:"T1", target_2:"T2",
    hi52:"52w High", close:"Close", symbol:"Symbol"};
  function scrLabel(k){ return SCR_LABELS[k] || k; }
  var BIGNUM = {volume:1, value_traded:1};

  function loadScreeners(){
    $("scrBtns").innerHTML = '<span class="muted">Loading…</span>';
    api("/screeners").then(function(d){
      var list = d.screeners||[];
      if(!list.length){ $("scrBtns").innerHTML='<span class="muted">No screeners yet.</span>'; return; }
      $("scrBtns").innerHTML = list.map(function(s){
        return '<button class="scrbtn" data-name="'+s.name+'">'+s.label+
          '<span class="n">'+s.count+'</span></button>';
      }).join('');
      Array.prototype.forEach.call($("scrBtns").querySelectorAll(".scrbtn"), function(b){
        b.onclick = function(){ showScreener(b.getAttribute("data-name"), b); };
      });
      var first = $("scrBtns").querySelector(".scrbtn");
      if(first) first.click();
    }).catch(function(e){ $("scrBtns").innerHTML='<span class="err">'+e.message+'</span>'; });
  }

  function showScreener(name, btn){
    Array.prototype.forEach.call($("scrBtns").querySelectorAll(".scrbtn"),
      function(b){ b.classList.remove("active"); });
    if(btn) btn.classList.add("active");
    $("scrNote").textContent = "";
    $("scrBody").innerHTML = '<span class="muted">Loading…</span>';
    api("/screener/"+encodeURIComponent(name)).then(function(d){
      $("scrNote").textContent = d.note || "";
      var rows = d.rows||[];
      if(!rows.length){ $("scrBody").innerHTML='<span class="muted">Is filter mein koi stock nahi.</span>'; return; }
      var cols = Object.keys(rows[0]).filter(function(c){ return ["company","sector"].indexOf(c)<0; });
      var pref = ["symbol","final_decision","close","change_pct"];
      var ordered = pref.filter(function(c){return cols.indexOf(c)>-1;})
        .concat(cols.filter(function(c){return pref.indexOf(c)<0;}));
      var h='<table><thead><tr>'+ordered.map(function(c){return '<th>'+scrLabel(c)+'</th>';}).join('')+
        '</tr></thead><tbody>';
      rows.forEach(function(r){
        h+='<tr>'+ordered.map(function(c){
          var v=r[c];
          if(c==="symbol") return '<td style="font-weight:800">'+(v==null?"":v)+'</td>';
          if(c==="final_decision") return '<td>'+(v?'<span class="pill '+badgeClass(v)+'">'+v+'</span>':'—')+'</td>';
          if(c==="change_pct"){var n=Number(v);
            return '<td style="color:'+(v==null?"var(--muted)":(n>=0?"var(--green)":"var(--red)"))+'">'+num(v)+'</td>';}
          return '<td>'+num(v, BIGNUM[c]?0:2)+'</td>';
        }).join('')+'</tr>';
      });
      $("scrBody").innerHTML = h+'</tbody></table>';
    }).catch(function(e){ $("scrBody").innerHTML='<span class="err">'+e.message+'</span>'; });
  }

  // ---- actions ----
  function loadAll(){
    $("signalBody").innerHTML = '<span class="muted">Loading…</span>';
    $("oppBody").innerHTML = '<span class="muted">Loading…</span>';
    api("/signal").then(renderSignal).catch(function(e){
      $("signalBody").innerHTML = '<span class="err">'+e.message+'</span>';
      if(/key/i.test(e.message)) showGate(e.message);
    });
    loadScreeners();
    api("/opportunities?limit=25").then(renderOpps).catch(function(e){
      $("oppBody").innerHTML = '<span class="err">'+e.message+'</span>';
    });
  }

  function lookup(){
    var t = ($("tk").value||"").trim().toUpperCase();
    if(!t) return;
    $("stockBody").innerHTML = '<span class="muted">Loading '+t+'…</span>';
    api("/stock/"+encodeURIComponent(t)).then(renderStock).catch(function(e){
      $("stockBody").innerHTML = '<span class="err">'+e.message+'</span>';
    });
  }

  function showMain(){ $("gate").classList.add("hide"); $("main").classList.remove("hide"); loadAll(); }
  function showGate(msg){
    $("main").classList.add("hide"); $("gate").classList.remove("hide");
    if(msg){ $("gateErr").textContent = msg; $("gateErr").classList.remove("hide"); }
    $("keyInput").value = getKey();
  }

  // ---- wire up ----
  $("keyBtn").onclick = function(){
    var k = ($("keyInput").value||"").trim();
    if(!k){ $("gateErr").textContent="Key daalein."; $("gateErr").classList.remove("hide"); return; }
    setKey(k); $("gateErr").classList.add("hide"); showMain();
  };
  $("keyInput").addEventListener("keydown", function(e){ if(e.key==="Enter") $("keyBtn").click(); });
  $("refreshBtn").onclick = loadAll;
  $("logoutBtn").onclick = function(){ clearKey(); showGate(); };
  $("tkBtn").onclick = lookup;
  $("tk").addEventListener("keydown", function(e){ if(e.key==="Enter") lookup(); });

  // boot
  if(getKey()) showMain(); else showGate();
})();
</script>
</body>
</html>
